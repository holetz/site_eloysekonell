<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Nível de Tomada de Decisão — instrumento de diagnóstico de prontidão decisória. EK Gestão e Consultoria, Eloyse Konell.">
<meta name="robots" content="noindex,nofollow">
<link rel="canonical" href="https://eloysekonell.com.br/nivel-de-tomada-de-decisao/">
<title>Nível de Tomada de Decisão &middot; EK Gestão e Consultoria</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Manrope:wght@400;500;600;700&display=swap">
<style>*{box-sizing:border-box}html,body{margin:0;padding:0}img{max-width:100%}</style>
</head>
<body>

<style>
/* ============================================================
   RÉGUA DECISÓRIA — EK Gestão e Consultoria
   Instrumento de diagnóstico de prontidão decisória
   Elaborado por EK Gestão e Consultoria
   ============================================================ */

:root{
  --paper:#F1EBE0;
  --paper-2:#F8F6F1;        /* rail e superfícies de apoio */
  --paper-3:#F2EFE8;
  --brown-deep:#2E2D22;     /* olive-deep */
  --brown:#3F3E30;
  --hair:#D6CFC1;
  --hair-2:#BEB5A2;
  --gold:#7A5F39;           /* bronze de texto, contraste AA */
  --gold-rule:#A88656;      /* bronze de filete */           /* dourado da marca, escurecido p/ contraste em branco */
  --gold-bright:#6B5230;
  --gold-tint:#EAE0CE;
  --gold-line:#A88656;      /* dourado exato da logo, só em filetes */
  --ink:#2E2D22;
  --muted:#514A3E;
  --muted-2:#6E6656;

  /* espectro da régua: olivastro -> dourado (tensão) -> cobre -> oxblood */
  --z1:#4B5A33;
  --z2:#7E7A41;
  --z3:#A88656;
  --z4:#9A6B3A;
  --z5:#7A3B24;

  --sp:clamp(16px,2.2vw,28px);
  --radius:0px;
  --shadow:none;
}

*,*::before,*::after{box-sizing:border-box}
title{display:none}

body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:"Manrope","Helvetica Neue",Arial,sans-serif;
  font-size:16px;
  line-height:1.62;
  -webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;
}

h1,h2,h3,h4{margin:0;text-wrap:balance;font-weight:600}
p{margin:0}
button{font:inherit;color:inherit}
input,select,textarea{font:inherit;color:inherit}

.eyebrow{
  font-family:"Manrope","Helvetica Neue",Arial,sans-serif;
  font-size:11px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--gold);font-weight:600;
}
.serif{font-family:"Cormorant Garamond",Georgia,serif}

/* ---------- estrutura ---------- */
.shell{display:grid;grid-template-columns:268px minmax(0,1fr);min-height:100vh}

.rail{
  background:var(--paper-2);
  border-right:1px solid var(--hair);
  padding:24px 20px 28px;
  display:flex;flex-direction:column;gap:24px;
  position:sticky;top:0;height:100vh;overflow-y:auto;
}
.rail-logo{display:block;width:100%;max-width:132px;height:auto}
.rail-sub{
  font-family:"Manrope","Helvetica Neue",Arial,sans-serif;font-size:9.5px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--muted-2);margin-top:12px;line-height:1.7;
}

.steps{display:flex;flex-direction:column;gap:1px;list-style:none;margin:0;padding:0}
.step-group{
  font-family:"Manrope","Helvetica Neue",Arial,sans-serif;font-size:9.5px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--muted-2);margin:14px 0 6px;
}
.step-btn{
  width:100%;text-align:left;background:none;border:0;cursor:pointer;
  padding:7px 10px 7px 12px;border-left:2px solid transparent;
  color:var(--muted);font-size:13.5px;line-height:1.35;
  display:flex;gap:9px;align-items:flex-start;transition:color .15s,border-color .15s,background .15s;
}
.step-btn:hover{color:var(--ink);background:rgba(168,134,86,.08)}
.step-btn .idx{font-size:10.5px;color:var(--muted-2);min-width:12px;flex:none;line-height:1.75}
.step-btn .lbl{flex:1}
.step-btn .ck{margin-left:auto;flex:none;color:var(--gold);font-size:10px;line-height:1.9}
.step-btn.is-active{color:var(--gold-bright);border-left-color:var(--gold-rule);background:var(--gold-tint);font-weight:600}
.step-btn:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{
  outline:2px solid var(--gold);outline-offset:2px;border-radius:0;
}

.rail-gauge{margin-top:auto;border-top:1px solid var(--hair);padding-top:16px}
.gauge-num{
  font-family:"Cormorant Garamond",Georgia,serif;font-size:44px;line-height:1;
  color:var(--brown);font-weight:600;
}
.gauge-num small{font-size:18px;color:var(--muted-2)}
.gauge-zone{font-size:12px;color:var(--muted);margin-top:2px}
.minirule{position:relative;height:8px;border-radius:0;margin-top:12px;background:linear-gradient(90deg,var(--z1) 0%,var(--z2) 28%,var(--z3) 50%,var(--z4) 74%,var(--z5) 100%)}
.minirule i{position:absolute;top:-4px;width:2px;height:16px;background:var(--r-ink);box-shadow:0 0 0 1px rgba(0,0,0,.6)}

/* ---------- barra lateral escura (contraponto ao corpo branco) ---------- */
.rail{
  background:var(--brown-deep);
  border-right:1px solid var(--brown-deep);
  --r-ink:#F1EBE0; --r-muted:#C7BEAC; --r-muted-2:#9A9081;
  --r-gold:#C2A679; --r-hair:#4A4A3A;
}
.rail .eyebrow{color:var(--r-gold)}
.rail-sub{color:var(--r-muted-2)}
.rail .step-group{color:var(--r-muted-2)}
.rail .step-btn{color:var(--r-muted)}
.rail .step-btn:hover{color:var(--r-ink);background:rgba(194,166,121,.10)}
.rail .step-btn .idx{color:var(--r-muted-2)}
.rail .step-btn .ck{color:var(--r-gold)}
.rail .step-btn.is-active{color:#E8DED0;border-left-color:var(--r-gold);background:rgba(194,166,121,.14)}
.rail .step-btn:focus-visible,.rail button:focus-visible{outline-color:var(--r-gold)}
.rail-gauge{border-top:1px solid var(--r-hair)}
.rail .gauge-num{color:var(--r-ink)}
.rail .gauge-num small{color:var(--r-muted)}
.rail .gauge-zone{color:var(--r-muted)}
.rail .minirule i{background:var(--r-ink);box-shadow:0 0 0 1px rgba(0,0,0,.65)}
.rail::-webkit-scrollbar{width:8px}
.rail::-webkit-scrollbar-track{background:var(--brown-deep)}
.rail::-webkit-scrollbar-thumb{background:#4A4A3A;border-radius:0}

/* ---------- conteúdo ---------- */
.main{padding:clamp(24px,4vw,56px) var(--sp) 140px;max-width:1020px}
.wrap{max-width:74ch}

.pagehead{border-bottom:1px solid var(--hair);padding-bottom:20px;margin-bottom:28px}
.pagehead h1{font-family:"Cormorant Garamond",Georgia,serif;font-size:clamp(30px,4.4vw,44px);line-height:1.08;margin-top:8px;color:var(--brown-deep)}
.pagehead .lede{color:var(--muted);margin-top:12px;max-width:64ch}

.card{
  background:var(--paper);border:1px solid var(--hair);border-radius:var(--radius);
  padding:clamp(18px,2.4vw,26px);}
.stack{display:flex;flex-direction:column;gap:18px}
.stack-lg{display:flex;flex-direction:column;gap:28px}

.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}

label.f{display:flex;flex-direction:column;gap:5px}
label.f > span{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
input[type=text],input[type=date],input[type=number],select,textarea{
  background:var(--paper);border:1px solid var(--hair-2);border-radius:0;
  padding:9px 11px;color:var(--ink);width:100%;
}
input[type=text]:hover,input[type=date]:hover,input[type=number]:hover,select:hover,textarea:hover{border-color:var(--gold-rule)}
textarea{resize:vertical;min-height:84px;line-height:1.55}
input::placeholder,textarea::placeholder{color:var(--muted-2)}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--gold) 50%),linear-gradient(135deg,var(--gold) 50%,transparent 50%);background-position:calc(100% - 16px) 18px,calc(100% - 11px) 18px;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:34px}

/* ---------- bloco do roteiro ---------- */
.bloco-n{font-family:"Cormorant Garamond",Georgia,serif;font-size:15px;color:var(--gold);letter-spacing:.04em}
.qlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0}
.qlist li{
  padding:13px 0 13px 26px;border-top:1px solid var(--hair);position:relative;max-width:70ch;
  font-family:"Cormorant Garamond",Georgia,serif;font-size:20px;line-height:1.38;color:var(--brown-deep);
}
.qlist li:first-child{border-top:0}
.qlist li::before{content:"—";position:absolute;left:0;top:15px;color:var(--gold);font-size:14px;font-family:"Manrope",sans-serif}

.escutar{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.chip{
  font-size:11.5px;letter-spacing:.05em;color:var(--gold-bright);
  border:1px solid var(--hair-2);border-radius:0;padding:3px 11px;background:var(--gold-tint);
}

.ancoras{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--hair);border-radius:var(--radius);overflow:hidden}
.anc{padding:15px 16px;font-size:13.5px;line-height:1.55;color:var(--muted)}
.anc:first-child{border-right:1px solid var(--hair);background:linear-gradient(90deg,rgba(75,90,51,.12),transparent)}
.anc:last-child{background:linear-gradient(270deg,rgba(122,59,36,.11),transparent)}
.anc b{display:block;font-family:"Manrope","Helvetica Neue",Arial,sans-serif;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin-bottom:6px;font-weight:600}

/* ---------- slider ---------- */
.sl{margin-top:6px}
.sl-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:14px}
.sl-val{font-family:"Cormorant Garamond",Georgia,serif;font-size:38px;line-height:1;color:var(--brown);font-weight:600}
.sl-val.is-empty{color:var(--muted-2)}
.sl-val small{font-size:16px;color:var(--muted-2)}
.sl-zone{font-size:12.5px;color:var(--muted);text-align:right;max-width:26ch}

.sl-track{position:relative;padding:0 0 26px}
input[type=range]{
  -webkit-appearance:none;appearance:none;width:100%;background:transparent;height:26px;margin:0;display:block;cursor:pointer;
}
input[type=range]::-webkit-slider-runnable-track{
  height:12px;border-radius:0;
  background:linear-gradient(90deg,var(--z1) 0%,var(--z2) 28%,var(--z3) 50%,var(--z4) 74%,var(--z5) 100%);
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:22px;height:22px;border-radius:50%;
  background:var(--paper);border:3px solid var(--paper);margin-top:-5px;
  box-shadow:0 0 0 1.5px var(--brown-deep),0 2px 6px rgba(46,45,34,.35);
}
input[type=range]::-moz-range-track{
  height:12px;border-radius:0;border:0;
  background:linear-gradient(90deg,var(--z1) 0%,var(--z2) 28%,var(--z3) 50%,var(--z4) 74%,var(--z5) 100%);
}
input[type=range]::-moz-range-thumb{
  width:20px;height:20px;border-radius:50%;background:var(--paper);border:3px solid var(--paper);
  box-shadow:0 0 0 1.5px var(--brown-deep),0 2px 6px rgba(46,45,34,.35);
}
.is-untouched input[type=range]::-webkit-slider-runnable-track{filter:grayscale(1) opacity(.3)}
.is-untouched input[type=range]::-moz-range-track{filter:grayscale(1) opacity(.3)}
.is-untouched input[type=range]::-webkit-slider-thumb{box-shadow:0 0 0 1.5px var(--hair-2)}
.is-untouched input[type=range]::-moz-range-thumb{box-shadow:0 0 0 1.5px var(--hair-2)}

.ticks{position:absolute;left:11px;right:11px;top:24px;height:20px;pointer-events:none}
.tick{position:absolute;transform:translateX(-50%);text-align:center}
.tick i{display:block;width:1px;height:6px;background:var(--hair-2);margin:0 auto 3px}
.tick span{font-size:10px;letter-spacing:.08em;color:var(--muted-2)}

.sl-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:8px}

/* ---------- escolha por faixa ---------- */
.bandas{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.banda{
  text-align:left;background:var(--paper);border:1px solid var(--hair-2);border-radius:0;
  padding:0 0 14px;cursor:pointer;display:flex;flex-direction:column;gap:8px;
  transition:border-color .15s,background .15s,box-shadow .15s;font:inherit;color:inherit;
}
.banda .cap{height:5px;border-radius:0;display:block}
.banda .lbl{
  font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted-2);
  font-weight:700;padding:0 13px;
}
.banda .txt{font-size:12.5px;line-height:1.45;color:var(--muted);padding:0 13px;flex:1}
.banda:hover{border-color:var(--gold-rule);background:var(--gold-tint)}
.banda.is-on{border-color:var(--brown-deep);box-shadow:inset 0 0 0 1px var(--brown-deep);background:var(--gold-tint)}
.banda.is-on .lbl{color:var(--brown-deep)}
.banda.is-on .txt{color:var(--ink)}
.banda .mk{
  font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;
  color:var(--brown-deep);padding:0 13px;margin-top:-2px;
}
.escolhido{
  display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;
  border-top:1px solid var(--hair);padding-top:14px;
}
.escolhido .nada{color:var(--muted-2);font-size:13px}
.escolhido .nome{font-family:"Cormorant Garamond",Georgia,serif;font-size:24px;color:var(--brown-deep);line-height:1.1}
.escolhido .det{font-size:12.5px;color:var(--muted)}

/* painel de contexto que acompanha a faixa em foco */
.banda-det{
  border:1px solid var(--hair);border-left:3px solid var(--hair-2);border-radius:0;
  background:var(--paper-2);padding:16px 18px;min-height:132px;
  transition:border-left-color .15s;
}
.banda-det .bd-head{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:12px}
.banda-det .bd-faixa{
  font-family:"Manrope","Helvetica Neue",Arial,sans-serif;font-size:11px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--brown-deep);font-weight:600;
}
.banda-det .bd-estilo{font-size:12px;color:var(--muted-2);letter-spacing:.04em}
.banda-det .bd-vazio{color:var(--muted-2);font-size:13.5px}
.bd-cols{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.bd-cols h5{
  font-family:"Manrope","Helvetica Neue",Arial,sans-serif;font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;
  font-weight:600;margin:0 0 5px;
}
.bd-cols p{font-size:13.5px;line-height:1.5;color:var(--ink)}
.bd-pos h5{color:var(--z1)}
.bd-neg h5{color:var(--z5)}

/* faixa exigida pelo cargo, sem digitar número */
.reqview{display:flex;flex-direction:column;gap:10px}
.reqrule{position:relative;height:18px;border-radius:0;background:linear-gradient(90deg,var(--z1) 0%,var(--z2) 28%,var(--z3) 50%,var(--z4) 74%,var(--z5) 100%)}
.reqrule .win{position:absolute;top:-5px;bottom:-5px;border:1.5px solid var(--brown-deep);border-radius:0;background:rgba(255,255,255,.28)}
.reqmarks{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted-2)}
.reqlab{font-size:14px;color:var(--ink)}
.reqlab b{color:var(--brown-deep)}
details.reqadj{border-top:1px solid var(--hair);padding-top:12px}
details.reqadj summary{
  cursor:pointer;font-size:11px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--gold-bright);font-weight:700;list-style:none;
}
details.reqadj summary::-webkit-details-marker{display:none}
details.reqadj summary::before{content:"+ ";}
details.reqadj[open] summary::before{content:"− ";}
details.reqadj summary:hover{color:var(--brown-deep)}
details.reqadj .grid2{margin-top:12px}

/* ---------- ações de reinício na barra lateral ---------- */
.rail-acoes{display:flex;flex-direction:column;gap:7px;margin-top:16px;padding-top:14px;border-top:1px solid var(--r-hair)}
.rail .rail-acoes .btn{
  border-color:#4A4A3A;background:transparent;color:var(--r-muted);
  padding:7px 11px;font-size:10px;letter-spacing:.11em;text-align:center;
}
.rail .rail-acoes .btn:hover{border-color:var(--r-gold);color:#E8DED0;background:rgba(194,166,121,.09)}
.rail .rail-acoes .btn.armado{border-color:#B4724F;color:#E0A98D;background:rgba(180,114,79,.12)}

/* ---------- cronômetro da conversa ---------- */
.timer{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.timer .t{
  font-family:"Cormorant Garamond",Georgia,serif;font-size:26px;line-height:1;
  color:var(--r-ink);font-variant-numeric:tabular-nums;
}
.timer.perto .t{color:#C2A679}
.timer.estourou .t{color:#D08F6A}
.timer .lim{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--r-muted-2)}
.rail .timer .btn{
  border-color:#4A4A3A;background:transparent;color:var(--r-gold);
  padding:4px 10px;font-size:10px;letter-spacing:.1em;margin-left:auto;
}
.rail .timer .btn:hover{border-color:var(--r-gold);background:rgba(194,166,121,.10);color:#E8DED0}

/* ---------- botões ---------- */
.btn{
  border:1px solid var(--hair-2);background:var(--paper);color:var(--ink);
  padding:9px 16px;border-radius:0;cursor:pointer;
  font-size:12px;letter-spacing:.13em;text-transform:uppercase;font-weight:600;
  line-height:1.2;white-space:nowrap;
  transition:border-color .15s,background .15s,color .15s;
}
.btn:hover{border-color:var(--gold-rule);color:var(--gold-bright);background:var(--gold-tint)}
.btn-primary{background:var(--brown-deep);border-color:var(--brown-deep);color:#C2A679}
.btn-primary:hover{background:var(--brown);border-color:var(--brown);color:#E8DED0}
.btn-ghost{border-color:transparent;background:transparent;color:var(--muted);padding-left:6px;padding-right:6px}
.btn-ghost:hover{color:var(--gold-bright);background:transparent}
.btn-sm{padding:5px 11px;font-size:10.5px;letter-spacing:.1em}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn[disabled]:hover{border-color:var(--hair-2);color:var(--ink);background:var(--paper)}

.actionbar{
  position:fixed;left:268px;right:0;bottom:0;z-index:20;
  background:linear-gradient(180deg,rgba(255,255,255,0) 0%,var(--paper) 32%);
  padding:26px var(--sp) 18px;
  display:flex;gap:12px;align-items:center;justify-content:flex-end;flex-wrap:wrap;
}
.actionbar .spacer{flex:1}
.actionbar .hint{font-size:12px;color:var(--muted-2);margin-right:auto}

/* ---------- régua grande do relatório (SVG: imprime sempre) ---------- */
.bigrule-wrap{padding:6px 0 0}
.ruleSvg{display:block;width:100%;height:auto;max-height:150px}
.rs-lbl{
  font-family:"Manrope","Helvetica Neue",Arial,sans-serif;font-size:11px;
  letter-spacing:1.5px;fill:#514A3E;
}
.rs-val{
  font-family:"Cormorant Garamond",Georgia,serif;font-size:25px;font-weight:600;fill:#2E2D22;
}
.rulelegend{display:flex;justify-content:space-between;margin-top:6px;gap:6px}
.rulelegend div{
  flex:1;text-align:center;font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted-2);border-top:1px solid var(--hair-2);padding-top:7px;
}
.rulelegend div.on{color:var(--gold-bright);border-top:2px solid var(--gold-rule);font-weight:700}

/* ---------- relatório ---------- */
.verdict{display:flex;gap:26px;align-items:flex-start;flex-wrap:wrap}
.verdict-num{
  font-family:"Cormorant Garamond",Georgia,serif;font-size:82px;line-height:.9;
  color:var(--brown-deep);font-weight:600;
}
.verdict-num small{font-size:26px;color:var(--gold)}
.verdict-txt{flex:1;min-width:240px}
.verdict-txt h2{font-family:"Cormorant Garamond",Georgia,serif;font-size:30px;line-height:1.14;color:var(--brown-deep)}
.verdict-txt .faixa{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-top:4px}

.sec{border-top:1px solid var(--hair);padding-top:20px;margin-top:26px}
.sec > h3{font-family:"Manrope","Helvetica Neue",Arial,sans-serif;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:600;margin-bottom:12px}
.sec p + p{margin-top:10px}

.twocol{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px}
.blist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.blist li{padding-left:18px;position:relative;font-size:14.5px;line-height:1.55;color:var(--muted)}
.blist li::before{content:"";position:absolute;left:0;top:9px;width:7px;height:0;border-top:1.5px solid var(--gold-rule)}
.blist.pos li::before{border-top-color:var(--z1)}
.blist.neg li::before{border-top-color:var(--z5)}

.callout{
  border-left:2px solid var(--gold-rule);background:var(--gold-tint);
  padding:14px 18px;border-radius:0;color:var(--ink);
}
.callout b{color:var(--gold-bright);font-weight:700}
.callout.warn{border-left-color:var(--z5);background:#F3E7DD}
.callout.warn b{color:var(--z5)}

.acao{border:1px solid var(--hair);border-radius:var(--radius);padding:16px 18px;background:var(--paper-2)}
.acao h4{font-size:14px;color:var(--brown-deep);margin-bottom:3px}
.acao .dir{font-size:10px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;margin-bottom:9px}
.dir-elevar{color:var(--z4)}
.dir-reduzir{color:var(--z1)}
.dir-sustentar{color:var(--gold)}
.acao ol{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:7px}
.acao ol li{font-size:14px;line-height:1.5;color:var(--muted)}
.acao ol li::marker{color:var(--gold);font-size:12px}

.perfilbars{display:flex;flex-direction:column;gap:11px}
.pb{display:grid;grid-template-columns:172px 1fr 40px;gap:12px;align-items:center;font-size:13px}
.pb-name{color:var(--muted)}
.pb-bar{position:relative;height:10px}
.pbSvg{display:block;width:100%;height:10px}
.pb-val{text-align:right;color:var(--brown);font-weight:700}

table.hist{width:100%;border-collapse:collapse;font-size:13.5px}
table.hist th{
  text-align:left;font-family:"Manrope","Helvetica Neue",Arial,sans-serif;font-size:9.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--gold);font-weight:600;padding:0 10px 8px 0;border-bottom:1px solid var(--hair-2);
}
table.hist td{padding:11px 10px 11px 0;border-bottom:1px solid var(--hair);color:var(--muted);vertical-align:middle}
table.hist tr:hover td{background:var(--gold-tint)}
table.hist td.nome{color:var(--brown-deep);font-weight:600}
table.hist td.sc{color:var(--brown);font-weight:700}
.tblwrap{overflow-x:auto}

/* ---------- devolutiva ---------- */
.devo{background:var(--paper);border:1px solid var(--hair);border-top:3px solid var(--gold-line);border-radius:var(--radius);padding:clamp(22px,3.4vw,40px);box-shadow:var(--shadow)}
.devo-head{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;flex-wrap:wrap;border-bottom:1px solid var(--hair);padding-bottom:18px;margin-bottom:24px}
.devo-head > div{flex:1 1 240px;min-width:0}
.devo-head img{width:112px;max-width:100%;height:auto;display:block;flex:0 0 auto}
.devo h2{font-family:"Cormorant Garamond",Georgia,serif;font-size:clamp(24px,3.2vw,34px);line-height:1.14;color:var(--brown-deep)}
.devo .lead{font-family:"Cormorant Garamond",Georgia,serif;font-size:20px;line-height:1.5;color:var(--ink)}
.mov{display:grid;grid-template-columns:34px 1fr;gap:14px;align-items:start;padding:14px 0;border-top:1px solid var(--hair)}
.mov .n{font-family:"Cormorant Garamond",Georgia,serif;font-size:26px;color:var(--gold);line-height:1}
.mov p{font-size:15px;line-height:1.55;color:var(--ink)}
.mov .tag{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted-2);margin-top:4px}

.sign{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:44px}
.sign div{border-top:1px solid var(--hair-2);padding-top:8px;font-size:11.5px;letter-spacing:.08em;color:var(--muted-2);text-transform:uppercase}

/* ---------- rodapé de crédito ---------- */
.credit{
  margin-top:56px;border-top:1px solid var(--hair);padding-top:20px;
  display:flex;gap:18px;align-items:center;flex-wrap:wrap;
}
.credit img{width:74px;height:auto;flex:none}
.credit .txt{font-size:11.5px;line-height:1.75;color:var(--muted);letter-spacing:.02em}
.credit .txt b{display:block;font-family:"Manrope","Helvetica Neue",Arial,sans-serif;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:600;margin-bottom:2px}
.credit a{color:var(--muted);text-decoration:none;border-bottom:1px solid var(--hair-2)}
.credit a:hover{color:var(--gold-bright);border-bottom-color:var(--gold)}

/* ---------- toast ---------- */
.toast{
  position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--brown-deep);border:1px solid var(--brown-deep);color:#F1EBE0;
  padding:11px 20px;border-radius:0;font-size:13.5px;z-index:60;
  opacity:0;pointer-events:none;transition:opacity .22s,transform .22s;
  box-shadow:0 10px 30px -12px rgba(46,45,34,.5);
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

.muted{color:var(--muted)}
.small{font-size:13px}
.tiny{font-size:11.5px;color:var(--muted);line-height:1.6}
.g{color:var(--gold-bright);font-weight:700}
.c-pos{color:var(--z1)!important}
.c-neg{color:var(--z5)!important}
.only-print{display:none}

.rail-toggle{display:none}

/* ---------- responsivo ---------- */
@media screen and (max-width:900px){
  .shell{grid-template-columns:1fr}
  .rail{position:static;height:auto;flex-direction:column;gap:16px;border-right:0;border-bottom:1px solid var(--hair)}
  .rail-gauge{margin-top:8px}
  .rail-toggle{
    display:flex;align-items:center;justify-content:space-between;width:100%;
    background:rgba(194,166,121,.07);border:1px solid #4A4A3A;border-radius:0;padding:9px 13px;cursor:pointer;
    font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--r-gold);font-weight:700;
  }
  .rail-toggle:hover{border-color:var(--r-gold)}
  .rail-toggle .caret{transition:transform .18s}
  .rail-nav{display:none}
  .rail.is-open .rail-nav{display:block}
  .rail.is-open .rail-toggle .caret{transform:rotate(180deg)}
  .actionbar{left:0}
  .ancoras{grid-template-columns:1fr}
  .anc:first-child{border-right:0;border-bottom:1px solid var(--hair)}
  .bandas{grid-template-columns:1fr}
  .bd-cols{grid-template-columns:1fr;gap:14px}
  .banda .cap{height:4px}
  .pb{grid-template-columns:1fr;gap:4px}
  .pb-val{text-align:left}
  .sign{grid-template-columns:1fr;gap:28px}
}

@media screen and (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}

/* ============================================================
   IMPRESSÃO — documento de entrega, A4
   Regra de ouro: nada que carregue informação pode depender de
   "gráficos de plano de fundo", que vêm desmarcados por padrão.
   ============================================================ */
@media print{
  @page{size:A4;margin:16mm 15mm}

  html,body{
    background:#fff;
    -webkit-print-color-adjust:exact;
    print-color-adjust:exact;
  }
  *{ -webkit-print-color-adjust:exact; print-color-adjust:exact; }

  .rail,.actionbar,.no-print,.toast,.rail-acoes,.timer{display:none!important}
  .only-print{display:block!important}
  .shell{display:block}
  .main{padding:0;max-width:none}

  /* o papel já é o quadro: cartões viram seções, sem caixa dentro de caixa */
  .card{
    background:transparent;border:0;border-radius:0;box-shadow:none;padding:0;
    margin-bottom:20px;
  }
  .card + .card{border-top:1px solid #BEB5A2;padding-top:20px}
  .devo{
    background:transparent;box-shadow:none;border:0;border-top:2.5px solid #A88656;
    border-radius:0;padding:16px 0 0;
  }

  /* quebras: nunca partir uma unidade de sentido, nunca deixar título órfão */
  .acao,.mov,.pb,.verdict,.bigrule-wrap,.callout,.twocol > div,.sign,.blist li{break-inside:avoid}
  .card,.sec,.blist,.twocol{break-inside:auto}
  .sec > h3,.acao h4,.acao .dir,.pagehead h1,.eyebrow,.bd-cols h5{break-after:avoid}
  .devo-head{break-after:avoid}
  p,li{orphans:3;widows:3}

  /* tipografia em papel */
  body{font-size:10.5pt;line-height:1.5;color:#2E2D22}
  .pagehead h1{font-size:23pt}
  .verdict-num{font-size:44pt}
  .verdict-num small{font-size:15pt}
  .verdict-txt h2{font-size:17pt}
  .devo h2{font-size:19pt}
  .devo .lead{font-size:12.5pt}
  .sec{margin-top:18px;padding-top:14px;border-top-color:#D6CFC1}
  .sec > h3{font-size:8.5pt;margin-bottom:8px}
  .blist li,.acao ol li,.small{font-size:10pt}
  .tiny{font-size:8.5pt}
  .mov p{font-size:10.5pt}

  /* cores: mantidas explicitamente, sem depender de tokens de tela */
  .pagehead h1,.verdict-num,.verdict-txt h2,.devo h2,.acao h4,.mov .n,.pb-val,.rs-val{color:#2E2D22}
  .eyebrow,.sec > h3,.acao .dir,.verdict-txt .faixa,.credit .txt b,.bd-cols h5{color:#7A5F39}
  .muted,.blist li,.acao ol li,.tiny,.credit .txt,.pb-name{color:#514A3E}
  .devo .lead,.mov p,.qlist li,.callout,.small{color:#2E2D22}
  .g,.callout b{color:#6B5230}
  .c-pos{color:#4B5A33!important}
  .c-neg{color:#7A3B24!important}
  .rulelegend div{color:#6E6656;border-top-color:#BEB5A2}
  .rulelegend div.on{color:#7A5F39;border-top:2px solid #A88656;font-weight:700}
  .sign div{border-top-color:#9A9081;color:#514A3E}
  .credit{border-top-color:#BEB5A2}
  .credit img{filter:none}
  a{color:#514A3E;text-decoration:none}

  /* caixas de destaque legíveis mesmo se o fundo não sair */
  .callout{
    background:#F1EBE0;border-left:2.5px solid #A88656;
    padding:11px 15px;
  }
  .callout.warn{background:#F3E7DD;border-left-color:#7A3B24}
  .acao{
    background:transparent;border:0;border-left:2px solid #BEB5A2;
    border-radius:0;padding:2px 0 2px 15px;margin-bottom:14px;
  }
  .mov{border-top-color:#D6CFC1;padding:11px 0}
  .mov .n{font-size:15pt;line-height:1.25}

  /* a régua e as barras são SVG: saem coloridas de qualquer jeito */
  .devo-head{padding-bottom:12px;margin-bottom:16px;gap:16px;flex-wrap:nowrap}
  .devo-head > div{flex:1 1 auto;min-width:0}
  .devo-head img{width:24mm;flex:0 0 24mm;margin-right:2mm}
  .ruleSvg{max-height:120px}
  .rs-lbl{fill:#514A3E}
  .pbSvg{height:9px}
  .pb{grid-template-columns:180px 1fr 44px}

  /* rodapé de crédito ao final do documento */
  .sign{grid-template-columns:1fr 1fr;gap:14mm;margin-top:22mm}
  .sign div{padding-top:6px;font-size:8.5pt}
  .credit{margin-top:22px;padding-top:14px;break-inside:avoid}
}
</style>

   ============================================================ */
const FUNCOES = [
  {id:"especialista", nome:"Especialista", min:45, max:65,
   obs:"Referência técnica no tema. Espera-se posição e recomendação, não apenas análise — cautela em excesso vira gargalo para quem depende do parecer."},
  {id:"analista", nome:"Analista", min:38, max:55,
   obs:"Analisa, recomenda e decide dentro do escopo definido. Precisa encerrar a análise com uma conclusão, não com opções em aberto."},
  {id:"assistente", nome:"Assistente", min:30, max:48,
   obs:"Executa com autonomia nas situações previstas e escala o que foge do padrão. A leitura do que é padrão precisa estar clara."},
  {id:"auxiliar", nome:"Auxiliar", min:22, max:40,
   obs:"Rotina com procedimento definido. A discricionariedade é baixa por desenho da função — decidir demais aqui é um risco, não uma virtude."},
  {id:"custom", nome:"Personalizado", min:38, max:55,
   obs:"Faixa definida pelo líder conforme o desenho real do cargo."}
];

/* ============================================================
   5. ESTADO
   ============================================================ */
const LS_KEY = "ek_regua_decisoria_v1";

function novoEstado(){
  const b = {};
  BLOCOS.forEach(function(x){ b[x.id] = {banda:null, v:50, touched:false, notas:""}; });
  return {
    step:0,
    nome:"", cargo:"", area:"", lider:"", data:hoje(),
    funcao:"analista", reqMin:38, reqMax:55,
    blocos:b,
    confianca:"media",
    ajuste:null,
    obs:"",
    compromissos:"",
    revisao:"",
    carregadoDe:null
  };
}
let S = novoEstado();

function hoje(){
  const d = new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function dataBR(iso){
  if(!iso) return "—";
  const p = String(iso).split("-");
  if(p.length!==3) return iso;
  return p[2]+"/"+p[1]+"/"+p[0];
}
function esc(s){
  return String(s==null?"":s).replace(/[&<>"']/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];
  });
}

/* ============================================================
   6. CÁLCULO
   ============================================================ */
function avaliados(){ return BLOCOS.filter(function(b){ return S.blocos[b.id].touched; }); }

function indiceBruto(){
  const a = avaliados();
  if(!a.length) return null;
  let s = 0; a.forEach(function(b){ s += S.blocos[b.id].v; });
  return s / a.length;
}
function indice(){
  if(S.ajuste !== null && S.ajuste !== undefined) return clamp(Math.round(S.ajuste),0,100);
  const b = indiceBruto();
  return b === null ? null : clamp(Math.round(b),0,100);
}
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }

function desvioPadrao(){
  const a = avaliados();
  if(a.length < 2) return null;
  const vals = a.map(function(b){ return S.blocos[b.id].v; });
  const m = vals.reduce(function(x,y){return x+y;},0)/vals.length;
  const va = vals.reduce(function(x,y){ return x + Math.pow(y-m,2); },0)/vals.length;
  return Math.sqrt(va);
}

function zonaDe(v){
  if(v === null) return null;
  if(v < 20) return Z.z1;
  if(v < 50) return Z.z2;
  if(v === 50) return Z.z3;
  if(v <= 80) return Z.z4;
  return Z.z5;
}
function zonaCurta(v){
  const z = zonaDe(v);
  return z ? z.nome : "—";
}
function direcaoGeral(v){
  if(v < S.reqMin) return "elevar";
  if(v > S.reqMax) return "reduzir";
  return "sustentar";
}
const DIR_LABEL = {
  elevar:"Elevar a prontidão para decidir",
  reduzir:"Aumentar o rigor antes de decidir",
  sustentar:"Sustentar e consolidar o padrão atual"
};
function emTensao(v){ return v >= 45 && v <= 55; }

function prioridades(){
  const centro = (S.reqMin + S.reqMax) / 2;
  const lista = avaliados().map(function(b){
    const dev = S.blocos[b.id].v - centro;
    return {bloco:b, dev:dev, abs:Math.abs(dev), dir: dev < 0 ? "elevar" : "reduzir"};
  });
  lista.sort(function(a,b){ return b.abs - a.abs; });
  return lista.filter(function(x){ return x.abs >= 8; }).slice(0,3);
}

function consistencia(){
  const sd = desvioPadrao();
  if(sd === null) return null;
  if(sd < 10)  return {nivel:"consistente", sd:sd, txt:"O comportamento decisório é estável entre as diferentes dimensões. O índice representa bem a pessoa em qualquer contexto."};
  if(sd <= 18) return {nivel:"variação esperada", sd:sd, txt:"Há variação normal entre dimensões. O índice é representativo, mas vale olhar as dimensões extremas separadamente."};
  return {nivel:"padrão situacional", sd:sd, txt:"A dispersão entre dimensões é alta: a pessoa decide de formas muito diferentes conforme a situação. O índice médio esconde essa variação — trabalhe as dimensões extremas, não a média."};
}

/* ============================================================
   7. NAVEGAÇÃO
   ============================================================ */
const STEPS = [{k:"abertura", nome:"Abertura e contexto", grupo:"A"}]
  .concat(BLOCOS.map(function(b,i){ return {k:"bloco:"+b.id, nome:b.titulo, grupo:"B", n:i+1}; }))
  .concat([
    {k:"sintese",    nome:"Síntese e calibragem", grupo:"C"},
    {k:"relatorio",  nome:"Relatório do líder",   grupo:"C"},
    {k:"devolutiva", nome:"Devolutiva",           grupo:"C"},
    {k:"historico",  nome:"Histórico",            grupo:"C"}
  ]);

function irPara(i){
  S.step = clamp(i,0,STEPS.length-1);
  render();
  window.scrollTo({top:0,behavior:"instant"});
  const m = document.getElementById("main"); if(m) m.focus({preventScroll:true});
}

/* ============================================================
   8. RENDER
   ============================================================ */
const main = document.getElementById("main");
const bar  = document.getElementById("actionbar");

function render(){
  renderNav();
  renderGauge();
  const st = STEPS[S.step];
  if(st.k === "abertura")       viewAbertura();
  else if(st.k.indexOf("bloco:")===0) viewBloco(st.k.slice(6));
  else if(st.k === "sintese"){ pausaCrono(); viewSintese(); }
  else if(st.k === "relatorio") viewRelatorio();
  else if(st.k === "devolutiva")viewDevolutiva();
  else if(st.k === "historico") viewHistorico();
}

function renderNav(){
  const g = {A:[],B:[],C:[]};
  STEPS.forEach(function(st,i){ g[st.grupo].push({st:st,i:i}); });
  [["navA","A"],["navB","B"],["navC","C"]].forEach(function(pair){
    const ul = document.getElementById(pair[0]);
    ul.innerHTML = "";
    g[pair[1]].forEach(function(o){
      const li = document.createElement("li");
      const b = document.createElement("button");
      b.className = "step-btn" + (o.i===S.step ? " is-active":"");
      let done = false;
      if(o.st.k.indexOf("bloco:")===0) done = S.blocos[o.st.k.slice(6)].touched;
      if(done) b.className += " is-done";
      b.innerHTML = '<span class="idx">'+(o.st.n ? o.st.n : "·")+'</span>'+
                    '<span class="lbl">'+esc(o.st.nome)+'</span>'+
                    (done ? '<span class="ck" title="dimensão avaliada">✓</span>' : '');
      b.onclick = function(){
        irPara(o.i);
        const r = document.querySelector(".rail");
        if(r && window.matchMedia("(max-width:900px)").matches) fecharRail();
      };
      li.appendChild(b); ul.appendChild(li);
    });
  });
  const lbl = document.getElementById("railToggleLabel");
  if(lbl) lbl.textContent = STEPS[S.step].nome;
}

function fecharRail(){
  const r = document.querySelector(".rail");
  const t = document.getElementById("railToggle");
  if(r){ r.classList.remove("is-open"); }
  if(t){ t.setAttribute("aria-expanded","false"); }
}

function renderGauge(){
  const v = indice();
  document.getElementById("gaugeNum").innerHTML = v===null ? "—" : v+'<small>%</small>';
  const n = avaliados().length;
  document.getElementById("gaugeZone").textContent =
    v===null ? "nenhum bloco avaliado" : zonaCurta(v)+" · "+n+"/"+BLOCOS.length+" blocos";
  const m = document.getElementById("gaugeMark");
  if(v===null){ m.style.display="none"; }
  else { m.style.display="block"; m.style.left = "calc("+v+"% - 1px)"; }
}

function actions(list){
  bar.innerHTML = "";
  list.forEach(function(a){
    if(a.type === "hint"){
      const s = document.createElement("span");
      s.className = "hint"; s.textContent = a.label; bar.appendChild(s); return;
    }
    const b = document.createElement("button");
    b.className = "btn " + (a.cls||"");
    b.textContent = a.label;
    if(a.disabled) b.disabled = true;
    b.onclick = a.on;
    bar.appendChild(b);
  });
}

/* ---------- 8.1 Abertura ---------- */
function viewAbertura(){
  const f = FUNCOES.map(function(x){
    return '<option value="'+x.id+'"'+(S.funcao===x.id?" selected":"")+'>'+esc(x.nome)+'</option>';
  }).join("");
  const fo = FUNCOES.filter(function(x){return x.id===S.funcao;})[0];

  main.innerHTML =
  '<div class="wrap stack-lg">'+
    '<div class="pagehead">'+
      '<div class="eyebrow">Como analisar · Situação atual</div>'+
      '<h1>Nível de Tomada de Decisão</h1>'+
      '<p class="lede">Instrumento de leitura para apoiar a análise do modelo atual de tomada de decisão do profissional.<br>O líder conduz uma conversa estruturada em seis dimensões.</p>'+
    '</div>'+

    '<div class="card stack">'+
      '<div class="grid2">'+
        '<label class="f"><span>Nome do profissional</span><input type="text" id="i_nome" value="'+esc(S.nome)+'" placeholder="Nome completo"></label>'+
        '<label class="f"><span>Cargo</span><select id="i_funcao">'+f+'</select></label>'+
        (S.funcao === "custom"
          ? '<label class="f"><span>Descreva o cargo</span><input type="text" id="i_cargo" value="'+esc(S.cargo)+'" placeholder="Como a posição é chamada na empresa"></label>'
          : '')+
        '<label class="f"><span>Área</span><input type="text" id="i_area" value="'+esc(S.area)+'" placeholder="Ex.: Operações"></label>'+
        '<label class="f"><span>Líder responsável</span><input type="text" id="i_lider" value="'+esc(S.lider)+'" placeholder="Quem conduz a conversa"></label>'+
        '<label class="f"><span>Data da conversa</span><input type="date" id="i_data" value="'+esc(S.data)+'"></label>'+
      '</div>'+
    '</div>'+

    '<div class="card stack">'+
      '<div class="eyebrow">Nível que a função exige</div>'+
      '<p class="small muted">A escala não tem um ponto “certo” universal: o que define se o nível é adequado é a exigência do cargo. A faixa abaixo já vem definida pelo cargo escolhido — não é preciso estipular nada.</p>'+
      '<div class="reqview">'+
        '<div class="reqrule"><div class="win" style="left:'+S.reqMin+'%;width:'+Math.max(1,S.reqMax-S.reqMin)+'%"></div></div>'+
        '<div class="reqmarks"><span>0% cauteloso</span><span>50% tensão</span><span>100% arriscado</span></div>'+
        '<p class="reqlab">Faixa de referência para <b>'+esc(cargoNome())+'</b>: de '+S.reqMin+'% a '+S.reqMax+'%.</p>'+
      '</div>'+
      '<div class="callout small" id="funcObs"><b>Por que essa faixa:</b> '+esc(fo?fo.obs:"")+'</div>'+
      '<details class="reqadj">'+
        '<summary>Ajustar a faixa manualmente</summary>'+
        '<p class="tiny">Use apenas se o desenho real da posição na empresa for diferente do padrão do cargo.</p>'+
        '<div class="grid2">'+
          '<label class="f"><span>Faixa mínima (%)</span><input type="number" id="i_min" min="0" max="100" value="'+S.reqMin+'"></label>'+
          '<label class="f"><span>Faixa máxima (%)</span><input type="number" id="i_max" min="0" max="100" value="'+S.reqMax+'"></label>'+
        '</div>'+
      '</details>'+
    '</div>'+

    '<div class="card stack">'+
      '<div class="eyebrow">Como conduzir</div>'+
      '<ul class="blist">'+
        '<li><b>Reserve 40 minutos, no máximo.</b> São cerca de 5 minutos por dimensão, mais a abertura e o fechamento. O cronômetro na lateral ajuda a manter o ritmo.</li>'+
        '<li>A conversa é de desenvolvimento, não de avaliação de desempenho — diga isso logo na abertura.</li>'+
        '<li>Em cada bloco, faça as perguntas abertas e deixe a pessoa narrar situações reais. Anote evidências, não impressões.</li>'+
        '<li>Só escolha a faixa depois de ouvir. Em cada dimensão há cinco descrições — marque a que mais se parece com o que a pessoa relatou, sem tentar acertar um número.</li>'+
        '<li>Não busque o meio. 50% não é o ponto ideal: é o ponto de tensão confirmada, o de maior custo interno de decisão.</li>'+
        '<li>Se não houve evidência suficiente em uma dimensão, deixe-a sem marcar. O índice é calculado apenas sobre o que foi observado.</li>'+
      '</ul>'+
    '</div>'+
    creditFooter()+
  '</div>';

  bindTexto("i_nome","nome"); bindTexto("i_area","area");
  bindTexto("i_lider","lider"); bindTexto("i_data","data");
  if(document.getElementById("i_cargo")) bindTexto("i_cargo","cargo");

  document.getElementById("i_funcao").onchange = function(e){
    S.funcao = e.target.value;
    const x = FUNCOES.filter(function(y){return y.id===S.funcao;})[0];
    if(x && x.id!=="custom"){ S.reqMin=x.min; S.reqMax=x.max; }
    viewAbertura();
  };
  function atualizaVisorFaixa(){
    const win = main.querySelector(".reqrule .win");
    const lab = main.querySelector(".reqlab");
    if(win){ win.style.left = S.reqMin+"%"; win.style.width = Math.max(1, S.reqMax-S.reqMin)+"%"; }
    if(lab){ lab.innerHTML = 'Faixa de referência para <b>'+esc(cargoNome())+'</b>: de '+S.reqMin+'% a '+S.reqMax+'%.'; }
    renderGauge();
  }
  document.getElementById("i_min").oninput = function(e){
    S.reqMin = clamp(parseInt(e.target.value||"0",10),0,100); atualizaVisorFaixa();
  };
  document.getElementById("i_max").oninput = function(e){
    S.reqMax = clamp(parseInt(e.target.value||"0",10),0,100); atualizaVisorFaixa();
  };

  actions([
    {label:"Histórico", cls:"btn-ghost", on:function(){ irPara(idxOf("historico")); }},
    {label:"Iniciar roteiro", cls:"btn-primary", on:function(){ iniciaCrono(); irPara(1); }}
  ]);
}

function bindTexto(id, campo){
  const el = document.getElementById(id);
  if(el) el.oninput = function(e){ S[campo] = e.target.value; };
}
function cargoNome(){
  const f = FUNCOES.filter(function(x){ return x.id === S.funcao; })[0];
  if(!f) return S.cargo || "—";
  if(f.id === "custom") return S.cargo.trim() || "Cargo personalizado";
  return f.nome;
}
function idxOf(k){
  for(let i=0;i<STEPS.length;i++) if(STEPS[i].k===k) return i;
  return 0;
}

/* ---------- 8.2 Bloco do roteiro ---------- */
function viewBloco(id){
  const b = BLOCOS.filter(function(x){return x.id===id;})[0];
  const st = S.blocos[id];
  const n = BLOCOS.indexOf(b)+1;

  main.innerHTML =
  '<div class="stack-lg">'+
    '<div class="pagehead">'+
      '<div class="eyebrow">Dimensão '+n+' de '+BLOCOS.length+' &nbsp;·&nbsp; cerca de 5 minutos</div>'+
      '<h1>'+esc(b.titulo)+'</h1>'+
      '<p class="lede">'+esc(b.foco)+'</p>'+
    '</div>'+

    '<div class="card stack">'+
      '<div class="eyebrow">Perguntas para a conversa</div>'+
      '<ul class="qlist">'+ b.perguntas.map(function(q){ return '<li>'+esc(q)+'</li>'; }).join("") +'</ul>'+
      '<div>'+
        '<div class="eyebrow" style="margin-bottom:8px">O que escutar</div>'+
        '<div class="escutar">'+ b.escutar.map(function(e){ return '<span class="chip">'+esc(e)+'</span>'; }).join("") +'</div>'+
      '</div>'+
    '</div>'+

    '<div class="card stack">'+
      '<div class="eyebrow">Onde o profissional se encaixa nesta dimensão</div>'+
      '<p class="small muted">Escolha a descrição mais próxima do que a pessoa relatou. Passe o mouse (ou toque) em cada faixa para ver o que ela entrega e o que ela custa. Não busque o meio: a faixa de 50% é a de tensão, não a ideal.</p>'+
      '<div class="bandas" role="group" aria-label="Faixa da dimensão '+esc(b.titulo)+'">'+
        BANDAS.map(function(bd){
          const on = (st.banda === bd.i);
          return '<button type="button" class="banda'+(on?" is-on":"")+'" data-banda="'+bd.i+'" aria-pressed="'+(on?"true":"false")+'">'+
            '<span class="cap" style="background:var(--'+bd.cor+')"></span>'+
            '<span class="lbl">'+esc(bd.faixa)+'</span>'+
            '<span class="txt">'+esc(b.niveis[bd.i].comp)+'</span>'+
            (on ? '<span class="mk">✓ selecionado</span>' : '')+
          '</button>';
        }).join("")+
      '</div>'+
      '<div class="banda-det" id="bandaDet">'+ detalheBanda(b, st.banda) +'</div>'+
      '<div class="escolhido" id="escolhido">'+ resumoEscolha(st) +'</div>'+
      '<label class="f"><span>Evidências observadas na conversa</span>'+
        '<textarea id="slNotas" placeholder="Situações concretas que a pessoa relatou e que justificam a faixa escolhida.">'+esc(st.notas)+'</textarea></label>'+
    '</div>'+
    creditFooter()+
  '</div>';

  const painel = document.getElementById("bandaDet");
  const grade  = main.querySelector(".bandas");
  function mostra(i){
    painel.innerHTML = detalheBanda(b, i);
    painel.style.borderLeftColor = (i===null||i===undefined) ? "" : "var(--"+BANDAS[i].cor+")";
  }
  mostra(st.banda);
  grade.addEventListener("mouseleave", function(){ mostra(st.banda); });

  main.querySelectorAll("[data-banda]").forEach(function(btn){
    const idx = parseInt(btn.getAttribute("data-banda"),10);
    btn.addEventListener("mouseenter", function(){ mostra(idx); });
    btn.addEventListener("focus", function(){ mostra(idx); });
    btn.onclick = function(){
      const i = parseInt(btn.getAttribute("data-banda"),10);
      st.banda = i; st.v = BANDAS[i].v; st.touched = true;
      main.querySelectorAll("[data-banda]").forEach(function(o){
        const on = (parseInt(o.getAttribute("data-banda"),10) === i);
        o.classList.toggle("is-on", on);
        o.setAttribute("aria-pressed", on ? "true" : "false");
        const mk = o.querySelector(".mk");
        if(on && !mk){ const e = document.createElement("span"); e.className="mk"; e.textContent="✓ selecionado"; o.appendChild(e); }
        if(!on && mk) mk.remove();
      });
      mostra(i);
      document.getElementById("escolhido").innerHTML = resumoEscolha(st);
      bindLimpar(st);
      renderGauge(); renderNav();
      const h = bar.querySelector(".hint");
      if(h) h.textContent = avaliados().length+" de "+BLOCOS.length+" dimensões registradas";
    };
  });
  document.getElementById("slNotas").oninput = function(e){ st.notas = e.target.value; };
  bindLimpar(st);

  const ultimo = (n === BLOCOS.length);
  actions([
    {type:"hint", label: avaliados().length+" de "+BLOCOS.length+" dimensões registradas"},
    {label:"Voltar", cls:"btn-ghost", on:function(){ irPara(S.step-1); }},
    {label: ultimo ? "Ir para a síntese" : "Próximo bloco", cls:"btn-primary", on:function(){ irPara(S.step+1); }}
  ]);
}

function detalheBanda(b, i){
  if(i === null || i === undefined){
    return '<span class="bd-vazio">Passe o mouse sobre uma faixa para ver o que ela entrega e o que ela custa nesta dimensão.</span>';
  }
  const bd = BANDAS[i], nv = b.niveis[i];
  return ''+
    '<div class="bd-head">'+
      '<span class="bd-faixa">'+esc(bd.faixa)+'</span>'+
      '<span class="bd-estilo">'+esc(bd.estilo)+'</span>'+
    '</div>'+
    '<div class="bd-cols">'+
      '<div class="bd-pos"><h5>O que essa faixa entrega</h5><p>'+esc(nv.forca)+'</p></div>'+
      '<div class="bd-neg"><h5>O que ela pode custar</h5><p>'+esc(nv.impacto)+'</p></div>'+
    '</div>';
}

function bindLimpar(st){
  const b = document.getElementById("btnLimpaBanda");
  if(!b) return;
  b.onclick = function(){
    st.banda = null; st.touched = false;
    main.querySelectorAll("[data-banda]").forEach(function(o){
      o.classList.remove("is-on"); o.setAttribute("aria-pressed","false");
      const mk = o.querySelector(".mk"); if(mk) mk.remove();
    });
    const pn = document.getElementById("bandaDet");
    if(pn){ pn.innerHTML = '<span class="bd-vazio">Passe o mouse sobre uma faixa para ver o que ela entrega e o que ela custa nesta dimensão.</span>'; pn.style.borderLeftColor = ""; }
    document.getElementById("escolhido").innerHTML = resumoEscolha(st);
    renderGauge(); renderNav();
    const h = bar.querySelector(".hint");
    if(h) h.textContent = avaliados().length+" de "+BLOCOS.length+" dimensões registradas";
  };
}

function resumoEscolha(st){
  if(st.banda === null) return '<span class="nada">Nenhuma faixa selecionada — esta dimensão fica fora do cálculo do índice.</span>';
  const bd = BANDAS[st.banda];
  return '<span class="nome">'+esc(bd.faixa)+'</span>'+
         '<span class="det">'+esc(bd.estilo)+' &nbsp;·&nbsp; equivale a '+bd.v+'% no índice &nbsp;·&nbsp; '+
         '<button class="btn btn-sm btn-ghost" id="btnLimpaBanda" style="padding:0;text-transform:none;letter-spacing:0;font-size:12.5px;border:0">limpar</button></span>';
}

/* ---------- 8.4 Relatório do líder ---------- */
let svgSeq = 0;
const STOPS = [["0%","#4B5A33"],["28%","#7E7A41"],["50%","#A88656"],["74%","#9A6B3A"],["100%","#7A3B24"]];

function gradienteDefs(id){
  return '<defs><linearGradient id="'+id+'" x1="0" y1="0" x2="1" y2="0">'+
    STOPS.map(function(st){ return '<stop offset="'+st[0]+'" stop-color="'+st[1]+'"/>'; }).join("")+
  '</linearGradient></defs>';
}

function reguaGrande(v){
  const W = 1000, H = 128;
  const px = function(pc){ return pc * (W/100); };
  const wx = px(S.reqMin), ww = Math.max(8, px(S.reqMax) - px(S.reqMin));
  const mx = px(v);
  const bw = 96, bh = 34;
  const bx = Math.max(0, Math.min(W - bw, mx - bw/2));
  const gid = "rgrad" + (++svgSeq);
  const zAtual = zonaDe(v);
  const legendas = [["< 20%","z1"],["20–49%","z2"],["50%","z3"],["51–80%","z4"],["> 80%","z5"]];

  return ''+
  '<div class="bigrule-wrap">'+
    '<svg class="ruleSvg" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet" role="img" '+
         'aria-label="Índice de '+v+' por cento na escala; faixa exigida pela função de '+S.reqMin+' a '+S.reqMax+' por cento.">'+
      gradienteDefs(gid)+
      '<rect x="0" y="34" width="'+W+'" height="26" rx="0" fill="url(#'+gid+')"/>'+
      '<rect x="'+wx.toFixed(1)+'" y="27" width="'+ww.toFixed(1)+'" height="40" rx="0" '+
            'fill="#F1EBE0" fill-opacity="0.34" stroke="#2E2D22" stroke-width="1.5" stroke-dasharray="6 4"/>'+
      '<text x="'+(wx+ww/2).toFixed(1)+'" y="17" text-anchor="middle" class="rs-lbl">'+
        'EXIGIDO PELA FUNÇÃO · '+S.reqMin+'–'+S.reqMax+'%</text>'+
      '<line x1="'+mx.toFixed(1)+'" y1="21" x2="'+mx.toFixed(1)+'" y2="73" stroke="#F1EBE0" stroke-width="7" stroke-linecap="butt"/>'+
      '<line x1="'+mx.toFixed(1)+'" y1="21" x2="'+mx.toFixed(1)+'" y2="73" stroke="#2E2D22" stroke-width="3" stroke-linecap="butt"/>'+
      '<rect x="'+bx.toFixed(1)+'" y="80" width="'+bw+'" height="'+bh+'" rx="0" fill="#F1EBE0" stroke="#A88656" stroke-width="1.2"/>'+
      '<text x="'+(bx+bw/2).toFixed(1)+'" y="'+(80+bh/2+9)+'" text-anchor="middle" class="rs-val">'+v+'%</text>'+
    '</svg>'+
    '<div class="rulelegend">'+
      legendas.map(function(l){
        return '<div class="'+(zAtual && zAtual.id===l[1] ? "on":"")+'">'+l[0]+'</div>';
      }).join("")+
    '</div>'+
  '</div>';
}

function barraDim(v, centro, marcada){
  const W = 1000, H = 10;
  const cx = centro * (W/100);
  return '<svg class="pbSvg" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" aria-hidden="true">'+
    '<rect x="0" y="1" width="'+W+'" height="8" rx="0" fill="#E8DED0" stroke="#BEB5A2" stroke-width="0.8"/>'+
    (marcada ? '<rect x="0" y="1" width="'+(v*(W/100)).toFixed(1)+'" height="8" rx="0" fill="#A88656"/>' : '')+
    '<rect x="'+(cx-1.5).toFixed(1)+'" y="0" width="3" height="'+H+'" fill="#6E6656"/>'+
  '</svg>';
}

  return ''+
  '<div class="acao">'+
    '<div class="dir dir-'+p.dir+'">'+(p.dir==="elevar"?"Elevar":"Aumentar rigor")+' · desvio de '+(p.dev>0?"+":"")+Math.round(p.dev)+' pontos</div>'+

}

/* ---------- 8.5 Devolutiva ao colaborador ---------- */
function viewDevolutiva(){
  const v = indice();
  if(v === null){ irPara(idxOf("sintese")); return; }
  const z = zonaDe(v);
  const dir = direcaoGeral(v);
  const prios = prioridades();
  const tensao = emTensao(v);

  let movimentos = [];
  if(tensao){
    movimentos = TENSAO_ACOES.slice(0,3).map(function(a){ return {txt:a, tag:"Critério de fechamento"}; });
  }
  prios.forEach(function(p){
    const lista = ACOES[p.bloco.id][p.dir];
    movimentos.push({txt:lista[0], tag:p.bloco.titulo});
  });
  if(movimentos.length < 3){
    MANUTENCAO.forEach(function(a){ if(movimentos.length<3) movimentos.push({txt:a, tag:"Consolidação"}); });
  }
  movimentos = movimentos.slice(0,3);

/* ---------- 8.6 Histórico ---------- */
function carregarHist(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    const arr = raw ? JSON.parse(raw) : [];
    return Array.isArray(arr) ? arr : [];
  }catch(e){ return []; }
}
function gravarHist(arr){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(arr)); return true; }
  catch(e){ return false; }
}
function salvarAvaliacao(){
  const v = indice();
  if(v === null){ toast("Avalie ao menos uma dimensão antes de salvar."); return; }
  if(!S.nome.trim()){ toast("Informe o nome do profissional na abertura antes de salvar."); return; }
  const arr = carregarHist();
  const blocosVal = {};
  BLOCOS.forEach(function(b){ blocosVal[b.id] = S.blocos[b.id].touched ? S.blocos[b.id].v : null; });
  const rec = {
    id: "r"+Date.now()+"_"+Math.floor(Math.random()*1e5),
    nome:S.nome, cargo:cargoNome(), area:S.area, lider:S.lider, data:S.data,
    funcao:S.funcao, reqMin:S.reqMin, reqMax:S.reqMax,
    score:v, zona:zonaCurta(v), confianca:S.confianca,
    blocos:blocosVal,
    notas:BLOCOS.reduce(function(o,b){ o[b.id]=S.blocos[b.id].notas; return o; },{}),
    obs:S.obs, compromissos:S.compromissos, revisao:S.revisao,
    ajuste:S.ajuste
  };
  arr.push(rec);
  if(gravarHist(arr)) toast("Avaliação salva no histórico deste navegador.");
  else toast("Não foi possível salvar. O navegador está bloqueando o armazenamento local.");
  renderNav();
}

function restaurar(rec){
  S = novoEstado();
  S.nome=rec.nome||""; S.cargo=rec.cargo||""; S.area=rec.area||""; S.lider=rec.lider||"";
  S.data=rec.data||hoje(); S.funcao=rec.funcao||"custom";
  S.reqMin=rec.reqMin!=null?rec.reqMin:38; S.reqMax=rec.reqMax!=null?rec.reqMax:55;
  S.confianca=rec.confianca||"media"; S.obs=rec.obs||""; S.compromissos=rec.compromissos||"";
  S.revisao=rec.revisao||""; S.ajuste=(rec.ajuste===undefined?null:rec.ajuste);
  BLOCOS.forEach(function(b){
    const val = rec.blocos ? rec.blocos[b.id] : null;
    S.blocos[b.id] = {
      banda: val==null ? null : bandaDe(val).i,
      v: val==null ? 50 : val,
      touched: val!=null,
      notas: (rec.notas && rec.notas[b.id]) ? rec.notas[b.id] : ""
    };
  });
  S.carregadoDe = rec.id;
  irPara(idxOf("relatorio"));
  toast("Avaliação de "+(rec.nome||"—")+" carregada.");
}

function viewHistorico(){
  const arr = carregarHist().slice().sort(function(a,b){
    return (b.data||"").localeCompare(a.data||"") || (b.id||"").localeCompare(a.id||"");
  });

  const linhas = arr.map(function(r){
    return '<tr>'+
      '<td class="nome">'+esc(r.nome||"—")+'<div class="tiny">'+esc([r.cargo,r.area].filter(Boolean).join(" · "))+'</div></td>'+
      '<td>'+dataBR(r.data)+'</td>'+
      '<td class="sc">'+r.score+'%</td>'+
      '<td>'+esc(r.zona||"—")+'</td>'+
      '<td>'+(r.reqMin!=null? r.reqMin+"–"+r.reqMax+"%" : "—")+'</td>'+
      '<td style="white-space:nowrap">'+
        '<button class="btn btn-sm" data-open="'+esc(r.id)+'">Abrir</button> '+
        '<button class="btn btn-sm btn-ghost" data-del="'+esc(r.id)+'">Excluir</button>'+
      '</td></tr>';
  }).join("");

  main.innerHTML =
  '<div class="stack-lg">'+
    '<div class="pagehead">'+
      '<div class="eyebrow">Registros salvos neste navegador</div>'+
      '<h1>Histórico de avaliações</h1>'+
      '<p class="lede">As avaliações ficam armazenadas apenas neste computador e neste navegador. Para consolidar o time ou preservar os dados, exporte o backup periodicamente.</p>'+
    '</div>'+
    '<div class="card">'+
      (arr.length ?
        '<div class="tblwrap"><table class="hist"><thead><tr>'+
        '<th>Profissional</th><th>Data</th><th>Índice</th><th>Faixa</th><th>Exigido</th><th></th>'+
        '</tr></thead><tbody>'+linhas+'</tbody></table></div>'
        : '<p class="muted small">Nenhuma avaliação salva ainda.</p>')+
    '</div>'+
    '<div class="card stack">'+
      '<div class="eyebrow">Backup</div>'+
      '<p class="small muted">O armazenamento do navegador pode ser apagado ao limpar dados de navegação. Exporte um arquivo de backup ao final de cada ciclo de avaliações.</p>'+
      '<div class="sl-actions">'+
        '<button class="btn btn-sm" id="btnExp">Exportar backup (JSON)</button>'+
        '<button class="btn btn-sm" id="btnImp">Importar backup</button>'+
        '<input type="file" id="fileImp" accept="application/json,.json" style="display:none">'+
      '</div>'+
    '</div>'+
    creditFooter()+
  '</div>';

  main.querySelectorAll("[data-open]").forEach(function(b){
    b.onclick = function(){
      const r = carregarHist().filter(function(x){ return x.id === b.getAttribute("data-open"); })[0];
      if(r) restaurar(r);
    };
  });
  main.querySelectorAll("[data-del]").forEach(function(b){
    b.onclick = function(){
      const id = b.getAttribute("data-del");
      const arr2 = carregarHist().filter(function(x){ return x.id !== id; });
      gravarHist(arr2); toast("Registro excluído."); viewHistorico();
    };
  });

  document.getElementById("btnExp").onclick = function(){
    const json = JSON.stringify(carregarHist(),null,2);
    const nomeArq = "nivel-tomada-decisao-backup.json";

    function baixarLocal(){
      const blob = new Blob([json],{type:"application/json"});
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = nomeArq;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); },1500);
      toast("Backup gerado.");
    }

    baixarLocal();
  };
  document.getElementById("btnImp").onclick = function(){ document.getElementById("fileImp").click(); };
  document.getElementById("fileImp").onchange = function(e){
    const f = e.target.files && e.target.files[0];
    if(!f) return;
    const fr = new FileReader();
    fr.onload = function(){
      try{
        const inc = JSON.parse(fr.result);
        if(!Array.isArray(inc)) throw new Error("formato");
        const atual = carregarHist();
        const ids = {}; atual.forEach(function(r){ ids[r.id]=1; });
        let n = 0;
        inc.forEach(function(r){ if(r && r.id && !ids[r.id]){ atual.push(r); n++; } });
        gravarHist(atual);
        toast(n+" registro(s) importado(s)."); viewHistorico();
      }catch(err){ toast("Arquivo inválido. Selecione um backup gerado por este sistema."); }
    };
    fr.readAsText(f);
  };

  actions([
    {label:"Voltar à abertura", cls:"btn-ghost", on:function(){ irPara(0); }},
    {label:"Nova avaliação", cls:"btn-primary", on:novaAvaliacao}
  ]);
}

/* ---------- cronômetro da conversa (limite de 35 min) ---------- */
const LIMITE_MIN = 40;
let crono = {inicio:null, acumulado:0, tick:null};

function tempoDecorrido(){
  return crono.acumulado + (crono.inicio ? (Date.now() - crono.inicio) : 0);
}
function pintaTempo(){
  const ms = tempoDecorrido();
  const seg = Math.floor(ms/1000);
  const mm = String(Math.floor(seg/60)).padStart(2,"0");
  const ss = String(seg%60).padStart(2,"0");
  const el = document.getElementById("tempoTxt");
  const wrap = document.getElementById("timer");
  if(el) el.textContent = mm+":"+ss;
  if(wrap){
    const min = seg/60;
    wrap.classList.toggle("perto", min >= LIMITE_MIN-5 && min < LIMITE_MIN);
    wrap.classList.toggle("estourou", min >= LIMITE_MIN);
  }
}
function rodando(){ return crono.inicio !== null; }
function iniciaCrono(){
  if(rodando()) return;
  crono.inicio = Date.now();
  crono.tick = setInterval(pintaTempo, 1000);
  pintaTempo(); rotuloCrono();
}
function pausaCrono(){
  if(!rodando()) return;
  crono.acumulado += Date.now() - crono.inicio;
  crono.inicio = null;
  clearInterval(crono.tick); crono.tick = null;
  pintaTempo(); rotuloCrono();
}
function zeraCrono(){
  clearInterval(crono.tick);
  crono = {inicio:null, acumulado:0, tick:null};
  pintaTempo(); rotuloCrono();
}
function rotuloCrono(){
  const b = document.getElementById("btnTempo");
  if(!b) return;
  b.textContent = rodando() ? "Pausar" : (tempoDecorrido() > 0 ? "Retomar" : "Iniciar");
}

/* ---------- toast ---------- */
let toastT = null;
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("on");
  clearTimeout(toastT);
  toastT = setTimeout(function(){ t.classList.remove("on"); }, 3200);
}

/* ---------- boot ---------- */
function confirmaEmDoisPassos(btn, acao){
  if(btn.dataset.armado === "1"){
    clearTimeout(btn._t);
    btn.dataset.armado = "";
    btn.textContent = btn.dataset.rotulo;
    btn.classList.remove("armado");
    acao();
    return;
  }
  if(!btn.dataset.rotulo) btn.dataset.rotulo = btn.textContent;
  btn.dataset.armado = "1";
  btn.textContent = "Confirmar?";
  btn.classList.add("armado");
  clearTimeout(btn._t);
  btn._t = setTimeout(function(){
    btn.dataset.armado = "";
    btn.textContent = btn.dataset.rotulo;
    btn.classList.remove("armado");
  }, 4000);
}

function limpaRespostas(){
  BLOCOS.forEach(function(b){ S.blocos[b.id] = {banda:null, v:50, touched:false, notas:""}; });
  S.ajuste = null; S.obs = ""; S.compromissos = ""; S.revisao = ""; S.carregadoDe = null;
  zeraCrono();
  irPara(1);
  toast("Respostas apagadas. Os dados do profissional foram mantidos.");
}

function novaAvaliacao(){
  S = novoEstado();
  zeraCrono();
  irPara(0);
  toast("Nova avaliação iniciada.");
}

document.getElementById("btnLimpar").onclick = function(){
  confirmaEmDoisPassos(this, limpaRespostas);
};
document.getElementById("btnNova").onclick = function(){
  confirmaEmDoisPassos(this, novaAvaliacao);
};

document.getElementById("btnTempo").onclick = function(){
  if(rodando()) pausaCrono(); else iniciaCrono();
};
document.getElementById("btnTempo").addEventListener("dblclick", function(){ zeraCrono(); });

document.getElementById("railToggle").onclick = function(){
  const r = document.querySelector(".rail");
  const open = !r.classList.contains("is-open");
  r.classList.toggle("is-open", open);
  this.setAttribute("aria-expanded", open ? "true" : "false");
};

window.__RD = {
  get S(){ return S; }, set S(x){ S = x; },
  BLOCOS:BLOCOS, ZONAS:ZONAS, indice:indice, zonaDe:zonaDe,
  direcaoGeral:direcaoGeral, prioridades:prioridades, consistencia:consistencia,
  irPara:irPara, idxOf:idxOf, render:render, emTensao:emTensao, novoEstado:novoEstado,
  BANDAS:BANDAS, bandaDe:bandaDe, iniciaCrono:iniciaCrono, pausaCrono:pausaCrono, zeraCrono:zeraCrono,
  tempoDecorrido:tempoDecorrido, limpaRespostas:limpaRespostas, novaAvaliacao:novaAvaliacao,
  LIMITE_MIN:LIMITE_MIN
};
render();
})();
